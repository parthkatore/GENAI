# ============================================================
# ArduinoMate — Render deployment manifest
# Deploy with:  Connect this repo in render.com → "Blueprint"
#
# Services
# --------
#   arduinomate-api  : FastAPI backend  (GET /health)
#   arduinomate-ui   : Streamlit frontend (/_stcore/health)
# ============================================================
services:
  - type: web
    name: arduinomate-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Pass the runtime stage explicitly
    # (Render uses the final stage by default; this is explicit for clarity)
    envVars:
      - key: PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set in Render dashboard — never committed to git
      - key: GEMINI_API_KEY
        sync: false          # used for embeddings — set in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: arduinomate-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: streamlit run ui/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: ARDUINOMATE_API_URL
        value: https://arduinomate-api.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /_stcore/health
    autoDeploy: true
