# ============================================================
# ArduinoMate — Continuous Integration
# Runs on every push and pull-request to master.
#
# Jobs
# ----
#   lint    : ruff check (style + imports)
#   test    : pytest 70 tests (mocked LLM + ChromaDB, no API key needed)
#   docker  : build + push to Docker Hub  (parthkatore/arduinomate-api)
#             push only on master; PRs do build-only (no push)
# ============================================================
name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  # ----------------------------------------------------------
  # Job 1: Lint with ruff
  # ----------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Run ruff
        run: ruff check .

  # ----------------------------------------------------------
  # Job 2: Run pytest suite (70 tests, no live API key needed)
  # ----------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      LLM_PROVIDER: groq
      GROQ_API_KEY: test-key-ci
      GEMINI_API_KEY: test-key-ci
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ----------------------------------------------------------
  # Job 3: Build Docker image; push to Docker Hub on master
  # ----------------------------------------------------------
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub only when pushing (master branch, not PRs)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: parthkatore
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          # Push only on master push; PRs do build-only
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            parthkatore/arduinomate-api:latest
            parthkatore/arduinomate-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
