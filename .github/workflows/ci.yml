# ============================================================
# ArduinoMate — Continuous Integration
# Runs on every push and pull-request to master.
#
# Jobs
# ----
#   lint    : ruff check (style + imports)
#   test    : pytest 44 tests (mocked LLM + ChromaDB, no API key needed)
#   docker  : docker build smoke-test (verify image builds cleanly)
# ============================================================
name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  # ----------------------------------------------------------
  # Job 1: Lint with ruff
  # ----------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: Run ruff
        run: ruff check .

  # ----------------------------------------------------------
  # Job 2: Run pytest suite (44 tests, no live API key needed)
  # ----------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Stub values so imports that read env vars don't crash
      LLM_PROVIDER: groq
      GROQ_API_KEY: test-key-ci
      GEMINI_API_KEY: test-key-ci
      # Disable HuggingFace network downloads during tests
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ----------------------------------------------------------
  # Job 3: Docker build smoke-test
  # ----------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: arduinomate:ci
          # Use inline build cache to speed up repeated runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
